<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Preço</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Nome do Preço</label> <input class="form-control"
									type="text" value="Individual">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Valor</label> <input class="form-control"
									type="text" value="R$15">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Descrição</label>
								<textarea cols="30" rows="6" class="form-control"></textarea>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label class="display-block">Status</label>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="status"
										id="pricing_active" value="option1" checked> <label
										class="form-check-label" for="pricing_active"> Ativo
									</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="status"
										id="pricing_inactive" value="option2"> <label
										class="form-check-label" for="pricing_inactive">
										Inativo </label>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit">Salvar
			Alterações</button>
	</div>
	</div>


</body>
</html>
