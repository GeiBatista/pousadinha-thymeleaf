<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>
	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<div class="mt-5">
						<h4 class="card-title float-left mt-2">Fundo Previdenciário</h4>
						<a href="add-provident-fund.html"
							class="btn btn-primary float-right veiwbutton">Adicionar
							Fundo Previdenciário</a>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-sm-12">
				<div class="card">
					<div class="card-body">
						<div class="table-responsive">
							<table class="datatable table table-stripped">
								<thead>
									<tr>
										<th>Nome do Funcionário</th>
										<th>Tipo de Fundo Previdenciário</th>
										<th>Parcela do Empregado</th>
										<th>Parcela da Organização</th>
										<th>Situação</th>
										<th class="text-right">Ações</th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<td>Albina Simonis</td>
										<td>Percentual do salário base</td>
										<td>2%</td>
										<td>2%</td>
										<td>Pendente</td>
										<td class="text-right">
											<div class="dropdown dropdown-action">
												<a href="#" class="action-icon dropdown-toggle"
													data-toggle="dropdown" aria-expanded="false"><i
													class="fas fa-ellipsis-v ellipse_color"></i></a>
												<div class="dropdown-menu dropdown-menu-right">
													<a class="dropdown-item" href="edit-provident-fund.html"><i
														class="fas fa-pencil-alt m-r-5"></i> Editar</a> <a
														class="dropdown-item" href="#" data-toggle="modal"
														data-target="#delete_asset"><i
														class="fas fa-trash-alt m-r-5"></i> Excluir</a>
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id="delete_asset" class="modal fade delete-modal" role="dialog">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body text-center">
					<img src="assets/img/sent.png" alt="" width="50" height="46">
					<h3 class="delete_class">Tem certeza que deseja excluir este
						ativo?</h3>
					<div class="m-t-20">
						<a href="#" class="btn btn-white" data-dismiss="modal">Fechar</a>
						<button type="submit" class="btn btn-danger">Excluir</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
