<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Fatura</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-md-12">
				<form>
					<div class="row">
						<div class="col-lg-12">
							<div class="row formtype">
								<div class="col-md-4">
									<div class="form-group">
										<label>Cliente *</label> <select class="form-control" id="sel1"
											name="sellist1">
											<option>Por favor selecione</option>
											<option>Charles Ortega</option>
											<option>Denise Stevens</option>
											<option>Jenifer Robinson</option>
										</select>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Departamento</label> <select class="form-control"
											id="sel2" name="sellist1">
											<option>Selecionar Departamento</option>
											<option>Dentistas</option>
											<option>Neurologia</option>
										</select>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>E-mail</label> <input class="form-control" type="text"
											value="charlesortega@example.com">
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Imposto</label> <select class="form-control" id="sel3"
											name="sellist1">
											<option>Selecionar Imposto</option>
											<option>IVA</option>
											<option>GST</option>
											<option>Sem Imposto</option>
										</select>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Endereço do Cliente</label>
										<textarea class="form-control" rows="3">5754 Airport Rd, Coosada, AL, 36020</textarea>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Endereço de Cobrança</label>
										<textarea class="form-control" rows="3">5754 Airport Rd, Coosada, AL, 36020</textarea>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Data da Fatura</label>
										<div class="cal-icon">
											<input type="text" class="form-control datetimepicker">
										</div>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Data de Vencimento</label>
										<div class="cal-icon">
											<input type="text" class="form-control datetimepicker">
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>
					<div class="row">
						<div class="col-md-12 col-sm-12">
							<div class="table-responsive">
								<table class="table table-hover table-white">
									<thead>
										<tr>
											<th style="width: 20px">#</th>
											<th class="col-sm-2">Item</th>
											<th class="col-md-6">Descrição</th>
											<th style="width: 100px;">Valor Unitário</th>
											<th style="width: 80px;">Qtd</th>
											<th>Valor</th>
											<th></th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td>1</td>
											<td><input class="form-control" type="text"
												value="Exame completo" style="min-width: 150px">
											</td>
											<td><input class="form-control" type="text"
												value="Descrição do serviço"
												style="min-width: 150px"></td>
											<td><input class="form-control" style="width: 100px"
												type="text" value="150"></td>
											<td><input class="form-control" style="width: 80px"
												type="text" value="1"></td>
											<td><input class="form-control form-amt" readonly=""
												style="width: 120px" type="text" value="150"></td>
											<td><a href="javascript:void(0)"
												class="text-success font-18" title="Adicionar"><i
													class="fas fa-plus"></i></a></td>
										</tr>
										<tr>
											<td>2</td>
											<td><input class="form-control" type="text"
												value="Exame de sangue" style="min-width: 150px"></td>
											<td><input class="form-control" type="text"
												value="Descrição do serviço"
												style="min-width: 150px"></td>
											<td><input class="form-control" style="width: 100px"
												type="text" value="12"></td>
											<td><input class="form-control" style="width: 80px"
												type="text" value="1"></td>
											<td><input class="form-control form-amt" readonly=""
												style="width: 120px" type="text" value="12"></td>
											<td><a href="javascript:void(0)"
												class="text-danger font-18" title="Remover"><i
													class="fas fa-trash-alt"></i></a></td>
										</tr>
										<tr>
											<td>3</td>
											<td><input class="form-control" type="text"
												value="Consulta geral" style="min-width: 150px"></td>
											<td><input class="form-control" type="text"
												value="Descrição do serviço"
												style="min-width: 150px"></td>
											<td><input class="form-control" style="width: 100px"
												type="text" value="100"></td>
											<td><input class="form-control" style="width: 80px"
												type="text" value="1"></td>
											<td><input class="form-control form-amt" readonly=""
												style="width: 120px" type="text" value="100"></td>
											<td><a href="javascript:void(0)"
												class="text-danger font-18" title="Remover"><i
													class="fas fa-trash-alt"></i></a></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="table-responsive">
								<table class="table table-hover table-white">
									<tbody>
										<tr>
											<td></td>
											<td></td>
											<td></td>
											<td></td>
											<td class="text-right">Total</td>
											<td style="text-align: right; width: 230px">262</td>
										</tr>
										<tr>
											<td colspan="5" style="text-align: right">Imposto</td>
											<td style="text-align: right; width: 230px"><input
												class="form-control text-right form-amt" value="0"
												readonly="" type="text"></td>
										</tr>
										<tr>
											<td colspan="5" style="text-align: right">Desconto %</td>
											<td style="text-align: right; width: 230px"><input
												class="form-control text-right" value="26.2" type="text">
											</td>
										</tr>
										<tr>
											<td colspan="5" style="text-align: right; font-weight: bold">
												Total Geral</td>
											<td
												style="text-align: right; font-weight: bold; font-size: 16px; width: 230px">
												$ 288.2</td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="row">
								<div class="col-md-12">
									<div class="form-group">
										<label>Outras Informações</label>
										<textarea class="form-control" rows="4"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit">Salvar Fatura</button>
	</div>
	</div>

</body>
</html>
