<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">
<head></head>

<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Reserva</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form>
                    <div class="row formtype">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>ID da Reserva</label>
                                <input class="form-control" type="text" value="BKG-0001"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Nome</label>
                                <select class="form-control" id="sel1" name="sellist1">
                                    <option>Selecione</option>
                                    <option>Jennifer Robinson</option>
                                    <option>Terry Baker</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Tipo de Quarto</label>
                                <select class="form-control" id="sel2" name="sellist1">
                                    <option>Selecione</option>
                                    <option>Single</option>
                                    <option>Double</option>
                                    <option>Quad</option>
                                    <option>King</option>
                                    <option>Suite</option>
                                    <option>Villa</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Total de Pessoas</label>
                                <select class="form-control" id="sel3" name="sellist1">
                                    <option>Selecione</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4</option>
                                    <option>5</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Data</label>
                                <div class="cal-icon">
                                    <input type="text" class="form-control datetimepicker"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Hora</label>
                                <div class="time-icon">
                                    <input type="text" class="form-control" id="datetimepicker3"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Data de Chegada</label>
                                <div class="cal-icon">
                                    <input type="text" class="form-control datetimepicker"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Data de Partida</label>
                                <div class="cal-icon">
                                    <input type="text" class="form-control datetimepicker"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="text" class="form-control" id="usr"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Telefone</label>
                                <input type="text" class="form-control" id="usr1"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Upload de Arquivo</label>
                                <div class="custom-file mb-3">
                                    <input type="file" class="custom-file-input" id="customFile" name="filename">
                                    <label class="custom-file-label" for="customFile">Escolher arquivo</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Mensagem</label>
                                <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Criar Reserva</button>
    </div>
</body>

</html>
