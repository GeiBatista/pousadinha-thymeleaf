<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head></head>

<body>
<!-- 		<div class="page-wrapper"> -->
			<div class="content container-fluid" layout:fragment="conteudo">
				<div class="page-header">
					<div class="row align-items-center">
						<div class="col">
							<h3 class="page-title mt-5">Adicionar Ativo</h3> </div>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-12">
						<form>
							<div class="row formtype">
								<div class="col-md-4">
									<div class="form-group">
										<label>Nome do ativo</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>ID do ativo</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Data de compra</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Comprado de</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Fabricante</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Modelo</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Número de série</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Fornecedor</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Condição</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Garantia</label>
										<input class="form-control" type="text"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>E-mail</label>
										<input type="text" class="form-control" id="usr"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Valor</label>
										<input type="text" class="form-control" id="usr1"> </div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Usuário do ativo</label>
										<select class="form-control" id="sel1" name="sellist">
											<option>Selecione</option>
											<option>John Doe</option>
											<option>Richard Miles</option>
										</select>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Descrição</label>
										<textarea class="form-control" rows="5" id="comment" name="text"></textarea>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Status</label>
										<select class="form-control" id="sel2" name="sellist">
											<option>Selecione</option>
											<option>Pendente</option>
											<option>Aprovado</option>
										</select>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
				<button type="button" class="btn btn-primary buttonedit">Adicionar Ativo</button>
			</div>
<!-- 		</div> -->
<!-- 	</div> -->
	<script src="assets/js/jquery-3.5.1.min.js"></script>
	<script src="assets/js/popper.min.js"></script>
	<script src="assets/js/bootstrap.min.js"></script>
	<script src="assets/js/moment.min.js"></script>
	<script src="assets/js/select2.min.js"></script>
	<script src="assets/plugins/slimscroll/jquery.slimscroll.min.js"></script>
	<script src="assets/js/bootstrap-datetimepicker.min.js"></script>
	<script src="assets/js/script.js"></script>
	<script>
	$(function() {
		$('#datetimepicker3').datetimepicker({
			format: 'LT'
		});
	});
	</script>
</body>

</html>
