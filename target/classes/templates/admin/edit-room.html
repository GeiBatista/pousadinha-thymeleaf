<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Quarto</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Número do Quarto</label> <input class="form-control"
									type="text" value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Tipo de Quarto</label> <select class="form-control" id="sel1"
									name="sellist1">
									<option>Selecionar</option>
									<option>Individual</option>
									<option>Duplo</option>
									<option>Quádruplo</option>
									<option>Cama King</option>
									<option>Suíte</option>
									<option>Villa</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Ar Condicionado</label> <select class="form-control" id="sel2"
									name="sellist1">
									<option>Selecionar</option>
									<option>Com Ar Condicionado</option>
									<option>Sem Ar Condicionado</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Alimentação</label> <select class="form-control" id="sel3"
									name="sellist1">
									<option>Selecionar</option>
									<option>Café da manhã gratuito</option>
									<option>Almoço gratuito</option>
									<option>Jantar gratuito</option>
									<option>Café da manhã e jantar gratuitos</option>
									<option>Bebida de boas-vindas gratuita</option>
									<option>Sem alimentação incluída</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Número de Camas</label> <select class="form-control" id="sel4"
									name="sellist1">
									<option>Selecionar</option>
									<option>1</option>
									<option>2</option>
									<option>3</option>
									<option>4</option>
									<option>5</option>
									<option>6</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Taxas de Cancelamento</label> <select
									class="form-control" id="sel5" name="sellist1">
									<option>Selecionar</option>
									<option>Gratuito</option>
									<option>5% antes de 24 horas</option>
									<option>Cancelamento não permitido</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Valor da Diária</label> <input type="text" class="form-control"
									id="usr">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Telefone</label> <input type="text"
									class="form-control" id="usr1">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Enviar Arquivo</label>
								<div class="custom-file mb-3">
									<input type="file" class="custom-file-input" id="customFile"
										name="filename"> <label class="custom-file-label"
										for="customFile">Escolher arquivo</label>
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Mensagem</label>
								<textarea class="form-control" rows="5" id="comment" name="text"></textarea>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit ml-2">Salvar</button>
		<button type="button" class="btn btn-primary buttonedit">Cancelar</button>
	</div>
	</div>
</body>
</html>
