<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">

<head>
</head>

<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Salário</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form>
                    <div class="row formtype">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Selecionar Funcionário</label>
                                <select class="form-control" id="sel1" name="sellist1">
                                    <option>Selecione</option>
                                    <option>Jennifer Robinson</option>
                                    <option>Terry Baker</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Salário Líquido</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Salário Base</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Imposto (TDS)</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>DA (40%)</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>ESI</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>HRA (15%)</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Fundo Previdenciário (PF)</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Deslocamento</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Licença</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Ajuda de Custo</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Imposto Profissional</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Auxílio Médico</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Bem-Estar do Trabalhador</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Outros</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Fundo</label>
                                <input class="form-control" type="text" value=""> </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Adicionar Salário</button>
    </div>
</body>

</html>
