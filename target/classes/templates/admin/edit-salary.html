<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Salário</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-3">
							<div class="form-group">
								<label>Selecionar Funcionário</label> <select class="form-control"
									id="sel1" name="sellist1">
									<option>John Doe</option>
									<option>Richard Miles</option>
								</select>
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Salário Líquido</label> <input class="form-control"
									type="text" value="$4000">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Básico</label> <input class="form-control" type="text"
									value="$6500">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>TDS</label> <input class="form-control" type="text"
									value="$300">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>DA (40%)</label> <input class="form-control" type="text"
									value="$2000">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>ESI</label> <input class="form-control" type="text"
									value="$20">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>HRA (15%)</label> <input class="form-control" type="text"
									value="$700">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>PF</label> <input class="form-control" type="text"
									value="$20">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Ajuda de Transporte</label> <input class="form-control"
									type="text" value="$70">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Licença</label> <input class="form-control" type="text"
									value="$250">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Benefícios</label> <input class="form-control" type="text"
									value="$30">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Imposto Profissional</label> <input class="form-control" type="text"
									value="$110">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Auxílio Médico</label> <input class="form-control"
									type="text" value="$20">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Bem-estar Trabalhista</label> <input class="form-control"
									type="text" value="$10">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Outros</label> <input class="form-control" type="text"
									value="">
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Fundo</label> <input class="form-control" type="text"
									value="$40">
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit1 mt-4">Salvar</button>
	</div>
	</div>

</body>
</html>
