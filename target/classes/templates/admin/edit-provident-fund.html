<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Fundo de Previdência</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Nome do Funcionário</label> <select class="form-control"
									id="sel1" name="sellist1">
									<option>John Doe (FT-001)</option>
									<option>Richard Miles (FT-0002)</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Tipo de Fundo de Previdência</label> <select class="form-control"
									id="sel2" name="sellist1">
									<option>Valor Fixo</option>
									<option>Percentual do salário base</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Parcela do Funcionário (Valor)</label> <input
									class="form-control" type="text" value="">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Parcela da Organização (Valor)</label> <input
									class="form-control" type="text" value="">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Parcela do Funcionário (%)</label> <input class="form-control"
									type="text" value="2%">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Parcela da Organização (%)</label> <input
									class="form-control" type="text" value="2%">
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label>Descrição</label>
								<textarea class="form-control"></textarea>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit">Salvar</button>
	</div>

</body>
</html>
