<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>

<body>

	<div class="content container-fluid" layout:fragment="conteudo">
			<div class="page-header">
				<div class="row align-items-center">
					<div class="col">
						<h3 class="page-title mt-5">Editar Blog</h3>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<form>
						<div class="row formtype">
							<div class="col-md-4">
								<div class="form-group">
									<label>Nome</label> <input class="form-control"
										type="text" value="John">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Upload de arquivo</label>
									<div class="custom-file mb-3">
										<input type="file" class="custom-file-input" id="customFile"
											name="filename"> <label class="custom-file-label"
											for="customFile">Escolher arquivo</label>
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Categoria</label> <select class="form-control"
										id="sel1" name="sellist1">
										<option>Selecione</option>
										<option>Eventos</option>
										<option>Quartos</option>
										<option>Vecículos</option>
									</select>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Sub-categoria</label> <select class="form-control"
										id="sel2" name="sellist1">
										<option>Selecione</option>
										<option>Pousada</option>
										<option>Quartos</option>
										<option>Quad</option>
										<option>King</option>
										<option>Suite</option>
										<option>Villa</option>
									</select>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Mensagem</label>
									<textarea class="form-control" rows="5" id="comment"
										name="text"></textarea>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="display-block">Status</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="status"
										id="blog_active" value="option1" checked> <label
										class="form-check-label" for="blog_active"> Ativo </label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="status"
										id="blog_inactive" value="option2"> <label
										class="form-check-label" for="blog_inactive"> Inativo
									</label>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
			<button type="button" class="btn btn-primary buttonedit">Salvar</button>
		</div>
</body>

</html>
