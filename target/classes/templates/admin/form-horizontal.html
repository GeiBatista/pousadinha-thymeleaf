<head></head>

<div class="page-wrapper">

</div>

</div>
<div class="card-body">
<form action="#">
<div class="form-group row">
<label class="col-lg-3 col-form-label">Nome</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">Sobrenome</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">Endereço de e-mail</label>
<div class="col-lg-9">
<input type="email" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">Nome de usuário</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>

</div>
</div>

<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">

<div class="col-lg-9">

</div>

<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
<div class="text-right">
<button type="submit" class="btn btn-primary">Enviar</button>

<div class="row">
<div class="col-md-12">
<div class="card">
<div class="card-header">
<h4 class="card-title">Formulário Horizontal em Duas Colunas</h4>
</div>
<div class="card-body">
<h4 class="card-title">Informações Pessoais</h4>
<form action="#">
<div class="row">
<div class="col-xl-6">
<div class="form-group row">
<label class="col-lg-3 col-form-label">Nome</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>

<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender" id="gender_male" value="option1" checked>
<label class="form-check-label" for="gender_male">
Masculino
</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender" id="gender_female" value="option2">
<label class="form-check-label" for="gender_female">
Feminino
</label>
</div>
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">Tipo sanguíneo</label>
<div class="col-lg-9">
<select class="select">
<option>Selecione</option>
<option value="1">A+</option>
<option value="2">O+</option>
<option value="3">B+</option>
<option value="4">AB+</option>
</select>
</div>
</div>
</div>
<div class="col-xl-6">

<input type="text" class="form-control">
</div>

<div class="form-group row">

<input type="password" class="form-control">

</div>
<div class="form-group row">

</div>
</div>
</div>
</div>

<div class="col-xl-6">

<label class="col-lg-3 col-form-label">Endereço linha 1</label>

<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">

</div>

</div>
</div>

<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">País</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-lg-3 col-form-label">Código Postal</label>
<div class="col-lg-9">
<input type="text" class="form-control">
</div>
</div>
</div>
</div>
<div class="text-right">
<button type="submit" class="btn btn-primary">Enviar</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</div>
