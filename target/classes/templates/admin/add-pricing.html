<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Tarifa</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form>
                    <div class="row formtype">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Nome do Tarifa</label>
                                <input class="form-control" type="text" value="single"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Valor do Tarifa</label>
                                <input type="text" class="form-control" id="usr"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Valor do Tarifa</label>
                                <input type="text" class="form-control" id="usr1"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Valor do Tarifa</label>
                                <input type="text" class="form-control" id="usr2"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Valor do Tarifa</label>
                                <input type="text" class="form-control" id="usr3"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Descrição do Tarifa</label>
                                <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Adicionar Tarifa</button>
    </div>
</body>
</html>
