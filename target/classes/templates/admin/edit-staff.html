<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Funcionário</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Nome</label> <input class="form-control"
									type="text" value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Sobrenome</label> <input class="form-control" type="text"
									value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Nome de Usuário</label> <input class="form-control" type="text"
									value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>E-mail</label> <input class="form-control" type="text"
									value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Senha</label> <input class="form-control" type="text"
									value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Confirmar Senha</label> <input class="form-control"
									type="text" value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>ID do Funcionário</label> <input class="form-control" type="text"
									value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Data de Ingresso</label>
								<div class="cal-icon">
									<input type="text" class="form-control datetimepicker">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Telefone</label> <input class="form-control"
									type="text" value="BKG-0001">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Cargo</label> <select class="form-control" id="sel1"
									name="sellist1">
									<option>Selecionar</option>
									<option>Administrador</option>
									<option>Gerente</option>
									<option>Funcionário</option>
									<option>Faxineiros</option>
									<option>Serviços</option>
									<option>Contador</option>
									<option>Recepcionista</option>
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit ml-2">Salvar</button>
	</div>
	</div>

</body>
</html>
