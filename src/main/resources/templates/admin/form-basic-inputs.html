<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>

<div class="content container-fluid" layout:fragment="conteudo">

<div class="page-header mt-5">
<div class="row">
<div class="col">
<h3 class="page-title">Entradas Básicas</h3>
</div>
</div>
</div>

<div class="row">
<div class="col-lg-12">
<div class="card">
<div class="card-header">
<h4 class="card-title">Entradas Básicas</h4>
</div>
<div class="card-body">
<form action="#">
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada de texto</label>
<div class="col-md-10">
<input type="text" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Senha</label>
<div class="col-md-10">
<input type="password" class="form-control">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada desabilitada</label>
<div class="col-md-10">
<input type="text" class="form-control" disabled="disabled">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada somente leitura</label>
<div class="col-md-10">
<input type="text" class="form-control" value="readonly" readonly="readonly">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Placeholder</label>
<div class="col-md-10">
<input type="text" class="form-control" placeholder="Placeholder">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada de arquivo</label>
<div class="col-md-10">
<input class="form-control" type="file">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Seleção padrão</label>
<div class="col-md-10">
<select class="form-control">
<option>-- Selecionar --</option>
<option>Opção 1</option>
<option>Opção 2</option>
<option>Opção 3</option>
<option>Opção 4</option>
<option>Opção 5</option>
</select>
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Rádio</label>
<div class="col-md-10">
<div class="radio">
<label>
<input type="radio" name="radio"> Opção 1
</label>
</div>
<div class="radio">
<label>
<input type="radio" name="radio"> Opção 2
</label>
</div>
<div class="radio">
<label>
<input type="radio" name="radio"> Opção 3
</label>
</div>
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Checkbox</label>
<div class="col-md-10">
<div class="checkbox">
<label>
<input type="checkbox" name="checkbox"> Opção 1
</label>
</div>
<div class="checkbox">
<label>
<input type="checkbox" name="checkbox"> Opção 2
</label>
</div>
<div class="checkbox">
<label>
<input type="checkbox" name="checkbox"> Opção 3
</label>
</div>
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Textarea</label>
<div class="col-md-10">
<textarea rows="5" cols="5" class="form-control" placeholder="Digite o texto aqui"></textarea>
</div>
</div>
<div class="form-group mb-0 row">
<label class="col-form-label col-md-2">Adições de entrada</label>
<div class="col-md-10">
<div class="input-group">
<div class="input-group-prepend">
<span class="input-group-text">$</span>
</div>
<input class="form-control" type="text">
<div class="input-group-append">
<button class="btn btn-primary" type="button">Botão</button>
</div>
</div>
</div>
</div>
</form>
</div>
</div>
<div class="card">
<div class="card-header">
<h4 class="card-title">Tamanhos de entrada</h4>
</div>
<div class="card-body">
<form action="#">
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada grande</label>
<div class="col-md-10">
<input type="text" class="form-control form-control-lg" placeholder=".form-control-lg">
</div>
</div>
<div class="form-group row">
<label class="col-form-label col-md-2">Entrada padrão</label>
<div class="col-md-10">
<input type="text" class="form-control" placeholder=".form-control">
</div>
</div>
<div class="form-group mb-0 row">
<label class="col-form-label col-md-2">Entrada pequena</label>
<div class="col-md-10">
<input type="text" class="form-control form-control-sm" placeholder=".form-control-sm">
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>

</body>
</html>
