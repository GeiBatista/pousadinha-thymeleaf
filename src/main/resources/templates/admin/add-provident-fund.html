<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">

<head>
</head>

<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Fundo Previdenciário</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form>
                    <div class="row formtype">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Nome do Funcionário</label>
                                <select class="form-control" id="sel1" name="sellist1">
                                    <option>Selecione</option>
                                    <option>John Doe</option>
                                    <option>Richard Miles</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Tipo de fundo previdenciário</label>
                                <select class="form-control" id="sel2" name="sellist1">
                                    <option>Selecione</option>
                                    <option>Valor fixo</option>
                                    <option>Porcentagem do salário base</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Participação do Funcionário (Valor)</label>
                                <input type="text" class="form-control" id="usr">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Participação da Organização (Valor)</label>
                                <input type="text" class="form-control" id="usr1">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Participação do Funcionário (%)</label>
                                <input type="text" class="form-control" id="usr2">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Participação da Organização (%)</label>
                                <input type="text" class="form-control" id="usr3">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Adicionar Fundo Previdenciário</button>
    </div>
</body>

</html>
