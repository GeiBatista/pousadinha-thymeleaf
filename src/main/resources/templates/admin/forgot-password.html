<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>
	<div class="main-wrapper login-body" >
		<div class="login-wrapper" layout:fragment="conteudo">
			<div class="container">
				<div class="loginbox">
					<div class="login-left"> <img class="img-fluid" th:src="@{/layout/admin/assets/img/logo.png}" alt="Logo"> </div>
					<div class="login-right">
						<div class="login-right-wrap">
							<h1>Esqueceu a senha?</h1>
							<p class="account-subtitle">Insira seu e-mail para receber um link de redefinição de senha</p>
							<form action="login.html">
								<div class="form-group">
									<input class="form-control" type="text" placeholder="E-mail"> </div>
								<div class="form-group mb-0">
									<button class="btn btn-primary btn-block" type="submit">Redefinir senha</button>
								</div>
							</form>
							<div class="text-center dont-have">Lembrou a senha? <a href="login.html">Entrar</a></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	
</body>

</html>
