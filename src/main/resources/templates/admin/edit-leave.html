<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

		<div class="content container-fluid" layout:fragment="conteudo">
			<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Licença</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Tipo de Licença</label> <select class="form-control" id="sel1"
									name="sellist1">
									<option>Selecione o Tipo de Licença</option>
									<option>Licença Casual - 12 dias</option>
								</select>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>De</label>
								<div class="cal-icon">
									<input type="text" class="form-control datetimepicker">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Até</label>
								<div class="cal-icon">
									<input type="text" class="form-control datetimepicker">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Número de Dias</label> <input class="form-control"
									type="text" value="2">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Dias Restantes</label> <input class="form-control"
									type="text" value="12">
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label>Motivo da Licença <span class="text-danger">*</span></label>
								<textarea rows="4" cols="5" class="form-control">Indo ao hospital</textarea>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit">Salvar</button>
	</div>
	</div>

</body>
</html>
