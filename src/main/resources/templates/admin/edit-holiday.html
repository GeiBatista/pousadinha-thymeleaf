<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Feriado</h3>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<form>
					<div class="row formtype">
						<div class="col-md-4">
							<div class="form-group">
								<label>Nome do Feriado</label> <input class="form-control"
									type="text" value="New Year">
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Data do Feriado</label>
								<div class="cal-icon">
									<input type="text" class="form-control datetimepicker">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<label>Número de Dias</label> <input class="form-control"
									type="text" value="30">
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit">Editar Feriado</button>
	</div>
	</div>


</body>
</html>
