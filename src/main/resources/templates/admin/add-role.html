<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Função</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-8">
                <form>
                    <div class="form-group">
                        <label>Nome da Função <span class="text-danger">*</span></label>
                        <input class="form-control" type="text"> </div>
                    <div class="form-group">
                        <label class="display-block">Status</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="role_active" value="option1" checked>
                            <label class="form-check-label" for="role_active"> Ativo </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="role_inactive" value="option2">
                            <label class="form-check-label" for="role_inactive"> Inativo </label>
                        </div>
                    </div>
                    <div class="m-t-20">
                        <button class="btn btn-primary submit-btn">Criar Função</button>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Adicionar Função</button>
    </div>
</body>
</html>
