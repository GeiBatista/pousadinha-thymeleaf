<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>

	<div class="content container-fluid" layout:fragment="conteudo">
		<div class="page-header">
			<div class="row align-items-center">
				<div class="col">
					<h3 class="page-title mt-5">Editar Perfil</h3>
				</div>
			</div>
		</div>
		<div class="box inform_css">
			<p class="card-title title_menu">Informações Básicas</p>
			<div class="row">
				<div class="col-lg-12">
					<form>
						<div class="row formtype">
							<div class="col-md-4">
								<div class="form-group">
									<label>Nome</label> <input class="form-control"
										type="text" value="Cristina ">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Sobrenome</label> <input class="form-control"
										type="text" value="Groves">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Data de Nascimento</label>
									<div class="cal-icon">
										<input type="text" class="form-control datetimepicker">
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Gênero</label> <select class="form-control" id="sel1"
										name="sellist1">
										<option>Masculino</option>
										<option>Feminino</option>
									</select>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="box inform_css mt-3">
			<p class="card-title title_menu">Informações de Contato</p>
			<div class="row">
				<div class="col-lg-12">
					<form>
						<div class="row formtype">
							<div class="col-md-12">
								<div class="form-group">
									<label>Endereço</label> <input type="text" class="form-control"
										value="4487 Snowbird Lane">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Estado</label> <input class="form-control" type="text"
										value="New York">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>País</label> <input class="form-control" type="text"
										value="Estados Unidos">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>CEP</label> <input class="form-control" type="text"
										value="10523">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Telefone</label> <input class="form-control"
										type="text" value="631-889-3206">
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="box inform_css mt-3">
			<p class="card-title title_menu">Informações Educacionais</p>
			<div class="row">
				<div class="col-lg-12">
					<form>
						<div class="row formtype">
							<div class="col-md-4">
								<div class="form-group">
									<label>Instituição</label> <input class="form-control"
										type="text" value="Universidade de Oxford">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Curso</label> <input class="form-control" type="text"
										value="Ciência da Computação">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Data de Início</label>
									<div class="cal-icon">
										<input type="text" class="form-control datetimepicker">
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Data de Conclusão</label>
									<div class="cal-icon">
										<input type="text" class="form-control datetimepicker">
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Formação</label> <input class="form-control" type="text"
										value="Bacharel em Ciência da Computação">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Nota</label> <input class="form-control" type="text"
										value="Nota A">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Gênero</label> <select class="form-control" id="sel2"
										name="sellist1">
										<option>Masculino</option>
										<option>Feminino</option>
									</select>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="box inform_css mt-3">
			<p class="card-title title_menu">Informações de Experiência</p>
			<div class="row">
				<div class="col-lg-12">
					<form>
						<div class="row formtype">
							<div class="col-md-4">
								<div class="form-group">
									<label>Nome da Empresa</label> <input class="form-control"
										type="text" value="Digital Devlopment Inc">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Localização</label> <input class="form-control" type="text"
										value="Estados Unidos">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Cargo</label> <input class="form-control"
										type="text" value="Desenvolvedor Web">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Período (De)</label>
									<div class="cal-icon">
										<input type="text" class="form-control datetimepicker">
									</div>
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label>Período (Até)</label>
									<div class="cal-icon">
										<input type="text" class="form-control datetimepicker">
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<button type="button" class="btn btn-primary buttonedit mt-3">Salvar</button>
	</div>


</body>
</html>
