<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/LayoutPadrao}">
<head></head>
<body>
    <div class="content container-fluid" layout:fragment="conteudo">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="page-title mt-5">Adicionar Licença</h3>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form>
                    <div class="row formtype">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Tipo de Licença</label>
                                <select class="form-control" id="sel1" name="sellist1">
                                    <option value=""> Selecionar </option>
                                    <option value="Casual Leave"> Licença Casual </option>
                                    <option value="Medical leave"> Licença Médica </option>
                                    <option value="loss of pay"> Perda de Pagamento </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>De</label>
                                <div class="cal-icon">
                                    <input type="text" class="form-control datetimepicker"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Para</label>
                                <div class="cal-icon">
                                    <input type="text" class="form-control datetimepicker"> </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Número de Dias</label>
                                <input type="text" class="form-control" id="usr"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Dias Restantes</label>
                                <input type="text" class="form-control" id="usr1"> </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Motivo da Licença</label>
                                <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <button type="button" class="btn btn-primary buttonedit1">Adicionar Licença</button>
    </div>
</body>
</html>
